<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0912">
    <title>Standard Label Printing | ACTMAX</title>
    <!-- Bootstrap 5 CSS -->
   <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="stylesheet" href="/css/standard-workflow.css">
    <link rel="stylesheet" href="/css/theme-modes.css">
    <script src="/app-shell.js" defer></script>
    
    <style>
        /* Custom styles to enhance the readonly fields visual distinction */
        .form-control[readonly] {
            background-color: var(--app-surface);
            color: var(--app-muted);
            cursor: default;
        }
        /* Style for the non-form response area */
        #response {
            border-top: 1px solid #dee2e6;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        #labelLogo { 
            width: 36px;
            height: 36px;
            padding: 4px;
            border: 1px solid #ffffff40;
            border-radius: 7px;
            background: #f8fafc;
            object-fit: contain;
            animation: standard-logo-enter .38s ease-out both;
        }

        @keyframes standard-logo-enter {
            from { opacity: 0; transform: scale(.82) rotate(-5deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }
    </style>
</head>
<body class="standard-page">
    <div id="app-shell"></div>
    <main class="standard-main">


    <div class="container">
        <!-- Card container for the form, centered and max-width set -->
                    
        <div class="card shadow-lg mx-auto" style="max-width: 500px;">

            <div class="card-body p-4 p-md-5">

            <div class="standard-brand">
    <h1 class="h1 fw-bold mb-0 me-1">ACTMAX</h1>
    <img id="labelLogo" src="/image/actmax_logo.png" alt="" class="order-1">
</div>
                <p class="standard-kicker">STANDARD PRODUCT LABEL PRINTING</p>

                <div class="alert alert-light border mb-3" role="status">
                    Standard workflow printer: <strong id="assignedPrinterLabel">Loading assignment…</strong>
                </div>

                <div class="pt-4">
                    <section id="standardPanel">
                        <form id="dataForm" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label for="MO" class="form-label fw-medium">MO :</label>
                                <input type="text" id="MO" name="MO" required
                                       class="form-control" placeholder="Enter Manufacturing Order">
                                <div class="invalid-feedback">MO field is required.</div>
                            </div>

                            <div class="mb-3">
                                <label for="ActID" class="form-label fw-medium">Actmax Part No. :</label>
                                <input type="text" id="ActID" name="ActID" required
                                       class="form-control" placeholder="Enter Actmax Part No.">
                                <div class="invalid-feedback">Actmax ID field is required.</div>
                            </div>

                            <div class="mb-3">
                                <label for="CustID" class="form-label fw-medium">Customer Part No. :</label>
                                <input type="text" id="CustID" name="CustID" readonly
                                       value="Awaiting print job..." class="form-control">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                                Print Label
                            </button>
                        </form>
                    </section>
                </div>

                <!-- General Response Area -->
                <div id="response" class="text-secondary mt-5">
                    <p id="message" class="text-sm">Enter the MO and Actmax Part No. for the Standard label.</p>
                </div>
            </div>
        </div>
    </div>
    </main>

    <!-- Bootstrap 5 JavaScript Bundle (Popper included) -->
    <script src="ajax.js?v=standard-workflow-1"></script>
</body>
</html>
